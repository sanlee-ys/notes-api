<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 280" width="920" height="280" role="img" aria-labelledby="title desc">
  <title id="title">notes-api architecture</title>
  <desc id="desc">HTTP flows through router.py, service.py, and models.py into SQLite or PostgreSQL. After POST, router schedules BackgroundTasks enrichment to an optional classifier at CLASSIFIER_URL.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#71717a"/>
    </marker>
    <marker id="arrowAccent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#2563eb"/>
    </marker>
  </defs>

  <!-- frame -->
  <rect x="0.5" y="0.5" width="919" height="279" rx="12" fill="#ffffff" stroke="#e4e4e7"/>

  <!-- main pipeline boxes -->
  <!-- HTTP -->
  <rect x="24" y="48" width="88" height="52" rx="10" fill="#f4f4f5" stroke="#d4d4d8"/>
  <text x="68" y="79" text-anchor="middle" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="14" font-weight="600" fill="#09090b">HTTP</text>

  <!-- router.py -->
  <rect x="148" y="48" width="112" height="52" rx="10" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="204" y="71" text-anchor="middle" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="13" font-weight="600" fill="#1e3a8a">router.py</text>
  <text x="204" y="88" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#3b82f6">/notes</text>

  <!-- service.py -->
  <rect x="296" y="48" width="112" height="52" rx="10" fill="#fafafa" stroke="#e4e4e7"/>
  <text x="352" y="79" text-anchor="middle" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="13" font-weight="600" fill="#09090b">service.py</text>

  <!-- models.py -->
  <rect x="444" y="48" width="112" height="52" rx="10" fill="#fafafa" stroke="#e4e4e7"/>
  <text x="500" y="79" text-anchor="middle" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="13" font-weight="600" fill="#09090b">models.py</text>

  <!-- SQLite / PostgreSQL -->
  <rect x="592" y="48" width="168" height="52" rx="10" fill="#f0fdf4" stroke="#86efac"/>
  <text x="676" y="71" text-anchor="middle" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="13" font-weight="600" fill="#14532d">SQLite / Postgres</text>
  <text x="676" y="88" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#16a34a">DATABASE_URL</text>

  <!-- main arrows -->
  <line x1="112" y1="74" x2="144" y2="74" stroke="#71717a" stroke-width="1.75" marker-end="url(#arrow)"/>
  <line x1="260" y1="74" x2="292" y2="74" stroke="#71717a" stroke-width="1.75" marker-end="url(#arrow)"/>
  <line x1="408" y1="74" x2="440" y2="74" stroke="#71717a" stroke-width="1.75" marker-end="url(#arrow)"/>
  <line x1="556" y1="74" x2="588" y2="74" stroke="#71717a" stroke-width="1.75" marker-end="url(#arrow)"/>

  <!-- enrichment branch from router -->
  <path d="M 204 100 V 148 H 296" fill="none" stroke="#2563eb" stroke-width="1.75" stroke-dasharray="5 4" marker-end="url(#arrowAccent)"/>

  <!-- BackgroundTasks -->
  <rect x="300" y="168" width="150" height="52" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-dasharray="4 3"/>
  <text x="375" y="191" text-anchor="middle" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="600" fill="#1e3a8a">BackgroundTasks</text>
  <text x="375" y="208" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#3b82f6">enrichment seam</text>

  <line x1="450" y1="194" x2="500" y2="194" stroke="#2563eb" stroke-width="1.75" marker-end="url(#arrowAccent)"/>

  <!-- classifier -->
  <rect x="504" y="168" width="256" height="52" rx="10" fill="#faf5ff" stroke="#d8b4fe"/>
  <text x="632" y="191" text-anchor="middle" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="600" fill="#581c87">classifier (optional)</text>
  <text x="632" y="208" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#9333ea">CLASSIFIER_URL</text>

  <!-- caption -->
  <text x="24" y="256" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="11" fill="#71717a">After POST /notes, router schedules in-process enrichment; skipped when CLASSIFIER_URL is unset.</text>
</svg>
