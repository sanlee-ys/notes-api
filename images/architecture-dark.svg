<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 280" width="920" height="280" role="img" aria-labelledby="title desc">
  <title id="title">notes-api architecture</title>
  <desc id="desc">HTTP flows through router.py, service.py, and models.py into SQLite or PostgreSQL. After POST, router schedules BackgroundTasks enrichment to an optional classifier at CLASSIFIER_URL.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#a1a1aa"/>
    </marker>
    <marker id="arrowAccent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#5c9eff"/>
    </marker>
  </defs>

  <!-- frame -->
  <rect x="0.5" y="0.5" width="919" height="279" rx="12" fill="#09090b" stroke="#27272a"/>

  <!-- main pipeline boxes -->
  <!-- HTTP -->
  <rect x="24" y="48" width="88" height="52" rx="10" fill="#18181b" stroke="#3f3f46"/>
  <text x="68" y="79" text-anchor="middle" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="14" font-weight="600" fill="#fafafa">HTTP</text>

  <!-- router.py -->
  <rect x="148" y="48" width="112" height="52" rx="10" fill="#0c1929" stroke="#1e3a5f"/>
  <text x="204" y="71" text-anchor="middle" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="13" font-weight="600" fill="#93c5fd">router.py</text>
  <text x="204" y="88" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#5c9eff">/notes</text>

  <!-- service.py -->
  <rect x="296" y="48" width="112" height="52" rx="10" fill="#111113" stroke="#27272a"/>
  <text x="352" y="79" text-anchor="middle" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="13" font-weight="600" fill="#fafafa">service.py</text>

  <!-- models.py -->
  <rect x="444" y="48" width="112" height="52" rx="10" fill="#111113" stroke="#27272a"/>
  <text x="500" y="79" text-anchor="middle" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="13" font-weight="600" fill="#fafafa">models.py</text>

  <!-- SQLite / PostgreSQL -->
  <rect x="592" y="48" width="168" height="52" rx="10" fill="#052e16" stroke="#166534"/>
  <text x="676" y="71" text-anchor="middle" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="13" font-weight="600" fill="#86efac">SQLite / Postgres</text>
  <text x="676" y="88" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#4ade80">DATABASE_URL</text>

  <!-- main arrows -->
  <line x1="112" y1="74" x2="144" y2="74" stroke="#a1a1aa" stroke-width="1.75" marker-end="url(#arrow)"/>
  <line x1="260" y1="74" x2="292" y2="74" stroke="#a1a1aa" stroke-width="1.75" marker-end="url(#arrow)"/>
  <line x1="408" y1="74" x2="440" y2="74" stroke="#a1a1aa" stroke-width="1.75" marker-end="url(#arrow)"/>
  <line x1="556" y1="74" x2="588" y2="74" stroke="#a1a1aa" stroke-width="1.75" marker-end="url(#arrow)"/>

  <!-- enrichment branch from router -->
  <path d="M 204 100 V 148 H 296" fill="none" stroke="#5c9eff" stroke-width="1.75" stroke-dasharray="5 4" marker-end="url(#arrowAccent)"/>

  <!-- BackgroundTasks -->
  <rect x="300" y="168" width="150" height="52" rx="10" fill="#0c1929" stroke="#1e3a5f" stroke-dasharray="4 3"/>
  <text x="375" y="191" text-anchor="middle" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="600" fill="#93c5fd">BackgroundTasks</text>
  <text x="375" y="208" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#5c9eff">enrichment seam</text>

  <line x1="450" y1="194" x2="500" y2="194" stroke="#5c9eff" stroke-width="1.75" marker-end="url(#arrowAccent)"/>

  <!-- classifier -->
  <rect x="504" y="168" width="256" height="52" rx="10" fill="#1a1025" stroke="#4c1d95"/>
  <text x="632" y="191" text-anchor="middle" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="600" fill="#e9d5ff">classifier (optional)</text>
  <text x="632" y="208" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#c084fc">CLASSIFIER_URL</text>

  <!-- caption -->
  <text x="24" y="256" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="11" fill="#71717a">After POST /notes, router schedules in-process enrichment; skipped when CLASSIFIER_URL is unset.</text>
</svg>
